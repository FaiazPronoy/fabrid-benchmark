step: crossval
model: maskrcnn_r50_aug
arm: session
seed: 0
fold: 2
gap_seconds: 30
imgsz: 640
batch: 4
epochs: 40
warmup_epochs: 2
lr: 0.0001
weight_decay: 0.0001
amp: true
hflip: 0.5
vflip: 0.5
mask_threshold: 0.5
workers: 2
device: cuda
hours_limit: 10.5
sanity:
  images: 8
  iterations: 150
  ratio: 0.5
remedies:
  aug: true
  paste: false
min_pixels: 4
aug:
  jitter: [0.6, 1.4]
  hue: 0.05
  scale: [0.6, 1.4]
  rotation: 15
paste:
  probability: 0.5
  count: [1, 3]
  scale: [0.75, 1.25]
  flip: 0.5
  sigma: 1.5
  margin: 5
publish: true
