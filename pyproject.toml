[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fabrid"
version = "0.1.0"
description = "Fabric defect instance segmentation benchmark"
requires-python = ">=3.11"
dependencies = ["numpy", "pillow", "pyyaml"]

[project.optional-dependencies]
kaggle = ["ultralytics>=8.3", "pycocotools", "scipy", "scikit-image", "timm"]
dev = ["pytest", "ruff", "scipy", "scikit-image"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PTH"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
